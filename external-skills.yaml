# external-skills.yaml — 外部 git 仓库技能清单（事实源）
#
# 三段结构（均为「段头 + 平铺 key: value」的 YAML 受限子集，段顺序自由、可省略）：
#   sources:            namespace: source-ref —— 要接入的仓库
#   host-aliases:       host: 别名 —— auto 推导 namespace 时覆盖内置默认 gh/glab
#   skill-filters:      namespace: 逗号分隔 skill 名 —— 多 skill 仓库只挂名单内的
#
# 挂载名规则：
#   - 多 skill 仓库（SKILL.md 在子目录）→ <namespace>.<skillName>
#   - 单 skill 仓库（SKILL.md 在根）→ namespace 本身（无点）
#
# 编辑须知：
#   - source-ref：github:owner/repo[@tag]、gitlab:owner/repo[@ref]、https://…git[@ref]
#   - ref 缺省 HEAD；生产/CI 用 tag 或 commit SHA
#   - namespace 写 auto 自动推导（REPO_ID → host别名.owner.repo → URL slug）
#   - skill-filters 的被筛选 namespace 必须是 sources: 里显式指定的（auto 推导无法稳定引用）
#   - skill-filters 名单里未匹配到的 skill 名会告警（拼错名会暴露）
#   - 同 namespace 同名 skill → apply fail-fast；完整语法见 README「外部技能」章节
#   - 缓存目录 ~/.agents/external-skills/<url-slug>/ 可手动删，apply 会重新 clone

host-aliases:
  github.com: gh
  gitlab.com: glab

skill-filters:
  humanlayer: show-me
  mattpocock: codebase-design, diagnosing-bugs, grilling, tdd, research

sources:
  auto: github:nothing0here/humanizer-zh
  humanlayer: github:humanlayer/skills
  mattpocock: github:mattpocock/skills
